# Global config for THE OBSERVER kit (Film II).
# Same hardened pipeline as THE MOMENT, but: (1) shots_observer.json,
# (2) an invented machine-augmented protagonist generated by src/forge_character.py
#     (NO real photos of Kunal are used or needed), (3) original score only.
film_title: "THE OBSERVER"
shots_file: shots_observer.json
fps: 24
interpolate_fps: 48
width: 1280
height: 720
base_model: Wan2.2-S2V
quant: Q8                          # Q5/Q6 fallback on a single T4; never Q4 for finals
steps: 30
cfg: 5.5
sampler: uni_pc
scheduler: beta
upscale: 1.75
rejection_samples: 3               # take best of N per shot
codeformer_fidelity: 0.7
max_clip_seconds: 5

paths:
  refs: refs
  script: script/lines_observer.csv
  audio_bg: audio/bg_observer
  audio_prompts: audio/prompts_observer.csv
  work: /tmp/observer_work           # scratch (NOT /kaggle/working which is capped)
  out: output_observer
  models: /kaggle/input/moment-models # SAME read-only model dataset mount as Film I

# ---- Character forge (Film II specific) --------------------------------------
# The protagonist is invented, not photographed. Before rendering, this step
# generates his reference stills (face angles + full body) from the prompts in
# shots_observer.json -> character_design, and files them into refs/observer/.
# The rest of the pipeline then treats him exactly like any photographed character.
character_forge:
  enabled: true
  targets: [observer]
  workflow: charforge            # text-to-image graph (workflows/charforge.json)
  out_root: refs                 # writes refs/<target>/face and refs/<target>/body
  overwrite: false               # skip if refs/<target>/face already populated

tts:
  english: hexgrad/Kokoro-82M
  backup: myshell-ai/MeloTTS-English
  hindi: ai4bharat/indic-parler-tts

score:
  duck_db: 16                       # duck score under narration (voice-forward)
  crossfade_ms: 1600
  shared_pad: true                  # faint pad under the whole film for continuity
  # ORIGINAL SCORE ONLY. Each movement = one original cue file spanning its shots,
  # crossfaded into the next. Violin-led, Zimmer-register. Drop the matching original
  # instrumental into audio/bg_observer/ (empty slot -> faint safe placeholder pad).
  # Do NOT use copyrighted score here; compose/commission original cues to publish.
  movements:
    cold_open:      { file: cold_open.mp3,      shots: [obs01_myth, obs02_facereveal, obs03_walk] }
    the_chair:      { file: the_chair.mp3,      shots: [obs04_chair, obs05_lightsdie] }
    midnight:       { file: midnight.mp3,       shots: [obs06_stillness, obs07_laugh, obs08_blackout] }
    machine_years:  { file: machine_years.mp3,  shots: [obs09_coma, obs10_ectoverload, obs11_rebuild, obs12_firstcurrent] }
    the_waking:     { file: the_waking.mp3,     shots: [obs13_rise, obs14_mirror_first, obs15_stand] }
    the_mirror:     { file: the_mirror.mp3,     shots: [obs16_city, obs17_doctors, obs18_satire, obs19_world] }
    the_amber_note: { file: the_amber_note.mp3, shots: [obs20_sealed, obs21_hershadow, obs22_unreachable] }
    the_verdict:    { file: the_verdict.mp3,    shots: [obs23_monologue, obs24_riseabove] }
    the_unreadable: { file: the_unreadable.mp3, shots: [obs25_dawn, obs26_lastlook, obs27_gone, obs28_endcard] }

gpu:
  hero_shots_mode: A                # pooled/DisTorch, Q8@720p
  simple_shots_mode: B              # split, one card per shot
  always_stage_split: true          # mode C

# ---- Hardware profiles (shared with Film I) ----------------------------------
active_profile: kaggle_2xt4

profiles:
  kaggle_2xt4:
    num_gpus: 2
    attention: xformers        # T4 = Turing sm_75: NO fp8 / NO SageAttention
    quant: Q8
    rejection_samples: 3
    steps: 30
    upscale: 1.75
    width: 1280
    height: 720
    rate_per_gpu_hr: 0.0       # Kaggle free tier
    comfy_flags: "--cache-none --disable-smart-memory"
  lightning_l4:
    num_gpus: 1
    attention: fp8             # L4 = Ada sm_89: fp8 OK -> faster
    quant: Q6
    rejection_samples: 1
    steps: 24
    upscale: 1.5
    width: 1152
    height: 648
    rate_per_gpu_hr: 0.48
    comfy_flags: "--fast --cache-none"

# ---- Music policy ----
# Voice-forward film. Original violin-led score plays UNDER the monologues; a
# fuller cue may swell in the wordless beats (the laugh, the rebuild, the ending).
music_policy:
  under_narration: instrumental_original
  swell_in_wordless_beats: true
  wordless_beats: [obs07_laugh, obs10_ectoverload, obs11_rebuild, obs15_stand, obs26_lastlook, obs27_gone]
  original_only: true               # never licensed score; commission/compose to publish
